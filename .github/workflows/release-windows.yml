name: Windows release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    if: ${{ !github.event.release.prerelease }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: Windows/global.json
      - name: Build shared editor
        working-directory: CoreEditor
        shell: pwsh
        run: |
          node .yarn/releases/yarn-4.18.0.cjs install --immutable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .yarn/releases/yarn-4.18.0.cjs build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .yarn/releases/yarn-4.18.0.cjs test --runInBand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test Windows
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid stable release tag' }
          $releaseVersion = $env:RELEASE_TAG -replace '^v', ''
          dotnet test Windows/Inkpot.Tests/Inkpot.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish Windows/Inkpot/Inkpot.csproj -c Release -p:Platform=x64 -p:Version=$releaseVersion -o build/Windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create Windows archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path build/Windows/* -DestinationPath build/Inkpot-windows-x64.zip
          $digest = (Get-FileHash build/Inkpot-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $pwd 'build/Inkpot-windows-x64.zip.sha256'), "$digest  Inkpot-windows-x64.zip`n", [Text.UTF8Encoding]::new($false))
      - name: Attach Windows assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: gh release upload $env:RELEASE_TAG build/Inkpot-windows-x64.zip build/Inkpot-windows-x64.zip.sha256
