name: Inkpot build and test

on:
  push:
    branches: ['main', 'feat/windows-mvp']
  pull_request:
    branches: ['main']
    types: [synchronize, opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      windows_only:
        description: '只运行 Windows 构建、测试与发布产物冒烟'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inkpot:
    runs-on: macos-26
    timeout-minutes: 30
    if: github.ref != 'refs/heads/feat/windows-mvp' && !(github.event_name == 'workflow_dispatch' && inputs.windows_only) && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Check release guards and measurement sampling
        run: |
          bash -n scripts/build.sh scripts/release.sh scripts/tests/release-checks.sh
          bash scripts/tests/release-checks.sh
          swift scripts/measure-perf.swift --self-test

      - name: Check website download routing
        run: node --test website/test/*.test.js

      - name: Build and test CoreEditor
        working-directory: CoreEditor
        run: |
          node .yarn/releases/yarn-4.18.0.cjs install --immutable
          node .yarn/releases/yarn-4.18.0.cjs notices
          git diff --exit-code -- ../App/Resources/ThirdPartyNotices.md
          node .yarn/releases/yarn-4.18.0.cjs build
          node .yarn/releases/yarn-4.18.0.cjs test --runInBand

      # 固定上游已有版本与校验和，仅解压 macOS 工具，不挂入应用构建。
      - name: Install SwiftLint 0.65.1
        run: |
          curl --fail --location --retry 3 https://github.com/realm/SwiftLint/releases/download/0.65.1/SwiftLintBinary.artifactbundle.zip --output "$RUNNER_TEMP/swiftlint.zip"
          printf '%s  %s\n' c3a1d77647ca18c1b7e9be7dbc6cd4490d26422f28814b76370244ff61970869 "$RUNNER_TEMP/swiftlint.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/swiftlint.zip" 'SwiftLintBinary.artifactbundle/macos/*' -d "$RUNNER_TEMP/swiftlint"

      - name: Lint Swift
        run: '"$RUNNER_TEMP/swiftlint/SwiftLintBinary.artifactbundle/macos/swiftlint" lint --strict --config .swiftlint.yml'

      - name: Build Inkpot
        run: |
          xcodebuild build -project App/Inkpot.xcodeproj -scheme Inkpot -destination 'platform=macOS' -derivedDataPath build/Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Test Inkpot
        run: |
          xcodebuild test -project App/Inkpot.xcodeproj -scheme Inkpot -destination 'platform=macOS' -derivedDataPath build/Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Test English localization
        run: |
          xcodebuild test -project App/Inkpot.xcodeproj -scheme Inkpot -destination 'platform=macOS' -derivedDataPath build/Debug -testLanguage en -only-testing:InkpotTests/LocalizationTests CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Check Release build and resources
        run: |
          xcodebuild build -project App/Inkpot.xcodeproj -scheme Inkpot -configuration Release -destination 'platform=macOS' -derivedDataPath build/Release CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          resources=build/Release/Build/Products/Release/Inkpot.app/Contents/Resources
          for file in index.html ThirdPartyNotices.md en.lproj/Localizable.strings zh-Hans.lproj/Localizable.strings math/katex.mjs math/mermaid.mjs math/katex.min.css math/lang-javascript.mjs; do
            test -s "$resources/$file"
          done
          test -d "$resources/math/fonts"

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: Windows/global.json

      - name: Build and test shared editor
        working-directory: CoreEditor
        run: |
          node .yarn/releases/yarn-4.18.0.cjs install --immutable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .yarn/releases/yarn-4.18.0.cjs build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .yarn/releases/yarn-4.18.0.cjs test --runInBand
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows application
        working-directory: Windows
        run: dotnet build Inkpot.Windows.sln -c Release -p:Platform=x64

      - name: Test file safety, preferences and workspace
        working-directory: Windows
        run: dotnet test Inkpot.Tests/Inkpot.Tests.csproj -c Release --logger trx --results-directory TestResults

      - name: Publish trimmed application
        working-directory: Windows
        run: dotnet publish Inkpot/Inkpot.csproj -c Release -p:Platform=x64 --no-restore -o ../build/Windows

      - name: Install shared Windows runtimes
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall.exe'
          Invoke-WebRequest 'https://aka.ms/windowsappsdk/2.5/2.5.1/windowsappruntimeinstall-x64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Windows App Runtime installer signature is invalid.' }
          $install = Start-Process $installer -ArgumentList '--quiet' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Windows App Runtime install failed: $($install.ExitCode)" }
          if (!(Test-Path "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application")) {
            $webview = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webview
            if ((Get-AuthenticodeSignature $webview).Status -ne 'Valid') { throw 'WebView2 installer signature is invalid.' }
            $install = Start-Process $webview -ArgumentList '/silent /install' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "WebView2 install failed: $($install.ExitCode)" }
          }

      - name: Launch application and record measurements
        run: ./Windows/scripts/measure.ps1 -AppDirectory build/Windows -ResultsDirectory build/WindowsResults

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: inkpot-windows-x64
          path: build/Windows/
          retention-days: 7

      - name: Upload Windows validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkpot-windows-validation
          path: |
            Windows/TestResults/
            build/WindowsResults/
          retention-days: 7
