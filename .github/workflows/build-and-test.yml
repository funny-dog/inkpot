name: Inkpot build and test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [synchronize, opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inkpot:
    runs-on: [self-hosted, macOS, ARM64, inkpot]
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Check release guards and measurement sampling
        run: |
          bash -n scripts/build.sh scripts/release.sh scripts/tests/release-checks.sh
          bash scripts/tests/release-checks.sh
          swift scripts/measure-perf.swift --self-test

      - name: Check website download routing
        run: node --test website/test/*.test.js

      - name: Build and test CoreEditor
        working-directory: CoreEditor
        run: |
          node .yarn/releases/yarn-4.18.0.cjs install --immutable
          node .yarn/releases/yarn-4.18.0.cjs notices
          git diff --exit-code -- ../App/Resources/ThirdPartyNotices.md
          node .yarn/releases/yarn-4.18.0.cjs build
          node .yarn/releases/yarn-4.18.0.cjs test --runInBand

      # 固定上游已有版本与校验和，仅解压 macOS 工具，不挂入应用构建。
      - name: Install SwiftLint 0.65.1
        run: |
          curl --fail --location --retry 3 https://github.com/realm/SwiftLint/releases/download/0.65.1/SwiftLintBinary.artifactbundle.zip --output "$RUNNER_TEMP/swiftlint.zip"
          printf '%s  %s\n' c3a1d77647ca18c1b7e9be7dbc6cd4490d26422f28814b76370244ff61970869 "$RUNNER_TEMP/swiftlint.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/swiftlint.zip" 'SwiftLintBinary.artifactbundle/macos/*' -d "$RUNNER_TEMP/swiftlint"

      - name: Lint Swift
        run: '"$RUNNER_TEMP/swiftlint/SwiftLintBinary.artifactbundle/macos/swiftlint" lint --strict --config .swiftlint.yml'

      - name: Build Inkpot
        run: |
          xcodebuild build -project App/Inkpot.xcodeproj -scheme Inkpot -destination 'platform=macOS' -derivedDataPath build/Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Test Inkpot
        run: |
          xcodebuild test -project App/Inkpot.xcodeproj -scheme Inkpot -destination 'platform=macOS' -derivedDataPath build/Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Test English localization
        run: |
          xcodebuild test -project App/Inkpot.xcodeproj -scheme Inkpot -destination 'platform=macOS' -derivedDataPath build/Debug -testLanguage en -only-testing:InkpotTests/LocalizationTests CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Check Release build and resources
        run: |
          xcodebuild build -project App/Inkpot.xcodeproj -scheme Inkpot -configuration Release -destination 'platform=macOS' -derivedDataPath build/Release CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          resources=build/Release/Build/Products/Release/Inkpot.app/Contents/Resources
          for file in index.html ThirdPartyNotices.md en.lproj/Localizable.strings zh-Hans.lproj/Localizable.strings math/katex.mjs math/mermaid.mjs math/katex.min.css math/lang-javascript.mjs; do
            test -s "$resources/$file"
          done
          test -d "$resources/math/fonts"
